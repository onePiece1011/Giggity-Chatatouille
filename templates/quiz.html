<!DOCTYPE html>
<html>
<head>
    <title>Quiz</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<form method="post" class="card slide-up">
    {% for q in questions %}
        <div class="question">
            <p>{{ q.text }}</p>
            {% for option in q.options %}
                <label>
                    <input type="radio" name="q{{ loop.index0 }}" value="{{ option }}" required>
                    {{ option }}
                </label><br>
            {% endfor %}
        </div>
    {% endfor %}
    <button class="btn">Verstuur</button>
</form>
</body>
</html>
